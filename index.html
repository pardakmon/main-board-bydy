<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영등포소방서 통합 현황판 허브</title>
    <link rel="apple-touch-icon" href="app-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="app-icon.png">
    <link rel="shortcut icon" href="app-icon.png">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --card-bg: #ffffff;
            --blue: #0071e3;
            --navy: #1e293b;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; letter-spacing: -0.5px;
        }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.8rem; font-weight: 700; margin: 0 0 10px 0; }
        .header p { font-size: 1.2rem; color: var(--text-sub); margin: 0; font-weight: 400; }
        
        /* 1. 로그인 폼 영역 */
        .login-box {
            background: #fff; padding: 32px; border-radius: 20px; width: 90vw; max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center;
            margin-bottom: 40px; /* 허브 화면과 간격 */
        }
        .field { margin-bottom: 16px; text-align: left; }
        .field label { font-size: 12px; color: #64748b; font-weight: 700; margin-bottom: 6px; display: block; }
        .field input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14.5px; background: #f8fafc; outline: none; transition: 0.2s; }
        .field input:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }
        .login-error { color: #e11d48; font-size: 12px; margin-top: -8px; margin-bottom: 12px; display: none; font-weight: 700; }
        
        button.main-btn { width: 100%; padding: 14px; font-size: 15px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button.main-btn:active { transform: scale(0.97); }
        button.sec-btn { width: 100%; padding: 12px; font-size: 14px; background: #f1f5f9; color: var(--navy); border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 12px; }

        /* 2. 허브 화면 영역 */
        #hubScreen { display: none; width: 100%; max-width: 800px; padding: 20px; flex-direction: column; align-items: center; }
        .hub-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-info { font-size: 16px; font-weight: 700; color: var(--navy); }
        
        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .card {
            background-color: var(--card-bg); width: 320px; height: 240px; border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease; box-sizing: border-box; padding: 30px; cursor: pointer;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08); }
        .card-icon { font-size: 4rem; margin-bottom: 20px; }
        .card-title { color: var(--text-main); font-size: 1.5rem; font-weight: 600; margin: 0 0 8px 0; }
        .card-desc { color: var(--text-sub); font-size: 1rem; text-align: center; margin: 0; }

        /* 팝업 모달 */
        .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
        .modal { background: #fff; border-radius: 16px; padding: 24px; width: 90vw; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="header">
        <h1>영등포소방서<br>통합 현황판</h1>
        <p>신속하고 정확한 현장 대응 시스템</p>
    </div>

    <!-- 1. 로그인 화면 -->
    <div id="loginScreen" class="login-box">
        <div class="field">
            <label>아이디 (이메일)</label>
            <input type="email" id="loginEmail" placeholder="team@fire.com">
        </div>
        <div class="field">
            <label>비밀번호</label>
            <input type="password" id="loginPwd" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') doLogin()">
        </div>
        <div id="loginError" class="login-error">아이디 또는 비밀번호를 확인해주세요.</div>
        
        <button type="button" class="main-btn" onclick="doLogin()">로그인하여 시스템 입장</button>
        
        <div style="margin-top:20px; display:flex; justify-content:center; align-items:center; gap:12px; font-size:13px;">
            <span onclick="openSignupModal()" style="color:var(--blue); font-weight:600; text-decoration:underline; cursor:pointer;">회원가입 신청</span>
            <span style="color:#cbd5e1;">|</span>
            <span onclick="handleResetPassword()" style="color:#64748b; font-weight:600; text-decoration:underline; cursor:pointer;">비밀번호 찾기</span>
        </div>
        
        <button type="button" class="sec-btn" onclick="enterSpectatorMode()" style="margin-top:24px;">👀 관전 모드 접속</button>
    </div>

    <!-- 2. 허브 화면 (현황판 선택) -->
    <div id="hubScreen">
        <div class="hub-header">
            <div class="user-info" id="hubUserInfo">대원님 환영합니다</div>
            <div style="display:flex; gap:8px;">
                <button id="btnAdminApproval" onclick="openApprovalModal()" style="display:none; padding:8px 12px; font-size:12px; background:#f0f9ff; color:#0284c7; border:1px solid #bae6fd; border-radius:8px; font-weight:700; cursor:pointer;">
                    👥 승인관리 <span id="pendingBadge" style="background:#ef4444; color:#fff; padding:2px 6px; border-radius:10px; margin-left:2px; display:none;">0</span>
                </button>
                <button onclick="doLogout()" style="padding:8px 12px; font-size:12px; background:#fff; color:#ef4444; border:1px solid #fca5a5; border-radius:8px; font-weight:700; cursor:pointer;">로그아웃</button>
            </div>
        </div>

        <div class="container">
            <div class="card" onclick="goToBoard('fire.html')">
                <div class="card-icon">🏢🔥</div>
                <h2 class="card-title">공동주택 화재</h2>
                <p class="card-desc">세대별 대피 및 구조 현황</p>
            </div>

            <div class="card" onclick="goToBoard('accident.html')">
                <div class="card-icon">🚗💥</div>
                <h2 class="card-title">교통사고</h2>
                <p class="card-desc">사고 발생 및 부상자 현황</p>
            </div>
        </div>
    </div>

    <!-- 팝업 모달 영역 -->
    <!-- 대원 회원가입 팝업 -->
    <div id="signupModal" class="overlay" style="display:none;">
      <div class="modal">
        <h3 style="margin:0 0 6px 0; color:var(--navy); font-size:18px; text-align:center; font-weight:800;">대원 회원가입 신청</h3>
        <p style="font-size:12px; color:#64748b; text-align:center; margin:0 0 16px 0;">관리자 승인 완료 후 이용이 가능합니다.</p>
        
        <div class="field"><label>대원 성명</label><input type="text" id="signupName" placeholder="예: 장건영"></div>
        <div class="field"><label>소속 및 팀</label><input type="text" id="signupTeam" placeholder="예: 현장대응단 2팀"></div>
        <div class="field">
          <label>아이디 (이메일)</label><input type="email" id="signupEmail" placeholder="예: ydp01@seoul.go.kr">
          <div style="font-size:11px; color:#64748b; margin-top:4px;">※ 비밀번호 분실 시 재설정 메일이 발송되므로, 실제 수신 가능한 이메일을 적어주세요.</div>
        </div>
        <div class="field"><label>비밀번호 (6자리 이상)</label><input type="password" id="signupPassword"></div>
        <div class="field"><label>비밀번호 확인</label><input type="password" id="signupPasswordConfirm"></div>
        
        <button type="button" class="main-btn" onclick="handleSignUp()">가입 신청하기</button>
        <button type="button" class="sec-btn" onclick="document.getElementById('signupModal').style.display='none'">닫기</button>
      </div>
    </div>

    <!-- 관리자 승인 팝업 -->
    <div id="approvalModal" class="overlay" style="display:none;">
      <div class="modal" style="max-width:440px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3 style="margin:0; font-size:16px; font-weight:800;">👥 대원 가입 승인 관리</h3>
          <button type="button" onclick="document.getElementById('approvalModal').style.display='none'" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; background:#fff; cursor:pointer;">닫기</button>
        </div>
        <div style="text-align:right; margin-bottom:8px;">
          <button onclick="approveAllUsers()" style="background:#10b981; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-weight:700; cursor:pointer;">전체 일괄 승인</button>
        </div>
        <div id="pendingUserList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>

    <!-- 파이어베이스 SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
    // 파이어베이스 설정 (기존 본체 그대로)
    const firebaseConfig = {
      apiKey: "AIzaSyBaGmIgVoIzrQ1WRdn8BwrO0fPOECNl-mQ",
      authDomain: "apartment-fire-board-bydy.firebaseapp.com",
      databaseURL: "https://apartment-fire-board-bydy-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "apartment-fire-board-bydy",
      storageBucket: "apartment-fire-board-bydy.firebasestorage.app",
      messagingSenderId: "389632256658",
      appId: "1:389632256658:web:3add30eae087876437d44b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let isSigningUp = false;

    function getDailyPin() {
      const today = new Date();
      return String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
    }

    function enterSpectatorMode() {
      const pwd = prompt("👀 관전 모드 접속 암호를 입력하세요.\n(모르실 경우 지휘차 또는 조사팀에 문의하세요)");
      if(pwd === getDailyPin()) { 
        sessionStorage.setItem('isSpectator', 'true');
        showHubScreen("관전 모드 (읽기 전용)");
      } else if (pwd !== null) {
        alert("❌ 암호가 일치하지 않습니다.");
      }
    }

    // ★ 현황판 이동 주소 설정 ★ (같은 폴더 안의 파일로 이동)
    function goToBoard(filename) {
      window.location.href = filename;
    }

    // 로그인 상태 감지
    auth.onAuthStateChanged(user => {
      if (isSigningUp) return;
      if (user) {
        db.ref('users/' + user.uid).once('value').then(snap => {
          const userData = snap.val();
          if (userData && userData.approved !== true) {
            alert("⏳ 관리자 승인 대기 중인 계정입니다.");
            auth.signOut();
            return;
          }
          sessionStorage.setItem('isSpectator', 'false');
          showHubScreen(`${userData.name} 대원`);
          
          const btnAdmin = document.getElementById('btnAdminApproval');
          if (userData.role === 'admin') {
            btnAdmin.style.display = 'block';
            listenPendingUsers();
          } else {
            btnAdmin.style.display = 'none';
          }
        });
      } else {
        if(sessionStorage.getItem('isSpectator') === 'true') {
          showHubScreen("관전 모드 (읽기 전용)");
        } else {
          document.getElementById('loginScreen').style.display = 'block';
          document.getElementById('hubScreen').style.display = 'none';
        }
      }
    });

    function showHubScreen(userNameText) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('hubScreen').style.display = 'flex';
      if(userNameText) document.getElementById('hubUserInfo').textContent = userNameText;
    }

    function doLogin() {
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPwd').value;
      document.getElementById('loginError').style.display = 'none';
      if(!email || !pwd) { document.getElementById('loginError').style.display = 'block'; return; }
      auth.signInWithEmailAndPassword(email, pwd).catch(e => { document.getElementById('loginError').style.display = 'block'; });
    }

    function doLogout() {
      if(confirm("로그아웃 하시겠습니까?")) {
        sessionStorage.removeItem('isSpectator');
        auth.signOut().then(() => location.reload());
      }
    }

    // 가입, 비밀번호 찾기, 승인 로직
    function openSignupModal() { document.getElementById('signupModal').style.display = 'flex'; }
    function handleSignUp() {
      const name = document.getElementById('signupName').value.trim();
      const team = document.getElementById('signupTeam').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pwd = document.getElementById('signupPassword').value;
      if (!name || !team || !email || !pwd) return alert("모든 항목을 입력해주세요.");
      if (pwd !== document.getElementById('signupPasswordConfirm').value) return alert("비밀번호가 일치하지 않습니다.");
      isSigningUp = true;
      auth.createUserWithEmailAndPassword(email, pwd).then(cred => {
        return db.ref('users/' + cred.user.uid).set({ name, team, email, approved: false, role: "user" });
      }).then(() => auth.signOut()).then(() => {
        isSigningUp = false; alert("✅ 가입 신청이 완료되었습니다!"); document.getElementById('signupModal').style.display = 'none';
      }).catch(e => { isSigningUp = false; alert("오류: " + e.message); });
    }
    function handleResetPassword() {
      const email = prompt("비밀번호를 재설정할 이메일 아이디를 입력해주세요:");
      if (email) auth.sendPasswordResetEmail(email.trim()).then(() => alert("✅ 재설정 메일이 발송되었습니다!")).catch(e => alert("발송 실패: " + e.message));
    }
    function listenPendingUsers() {
      db.ref('users').orderByChild('approved').equalTo(false).on('value', snap => {
        const count = snap.val() ? Object.keys(snap.val()).length : 0;
        document.getElementById('pendingBadge').textContent = count;
        document.getElementById('pendingBadge').style.display = count > 0 ? 'inline' : 'none';
      });
    }
    function openApprovalModal() {
      document.getElementById('approvalModal').style.display = 'flex';
      db.ref('users').orderByChild('approved').equalTo(false).once('value', snap => {
        const users = snap.val();
        const list = document.getElementById('pendingUserList');
        if (!users) return list.innerHTML = '<div style="padding:10px;">대기자 없음</div>';
        list.innerHTML = Object.entries(users).map(([uid, u]) => `
          <div style="background:#f8fafc; padding:10px; border-radius:8px; display:flex; justify-content:space-between;">
            <div><b>${u.name}</b> (${u.team})<br><span style="font-size:11px;">${u.email}</span></div>
            <div>
              <button onclick="db.ref('users/${uid}/approved').set(true).then(openApprovalModal)" style="background:#0071e3;color:#fff;border:none;padding:4px 8px;border-radius:4px;">승인</button>
              <button onclick="db.ref('users/${uid}').remove().then(openApprovalModal)" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:4px;">거절</button>
            </div>
          </div>
        `).join('');
      });
    }
    function approveAllUsers() {
      db.ref('users').orderByChild('approved').equalTo(false).once('value', snap => {
        const users = snap.val(); if(!users) return;
        const updates = {}; Object.keys(users).forEach(uid => updates[`users/${uid}/approved`] = true);
        db.ref().update(updates).then(() => { alert("일괄 승인 완료"); openApprovalModal(); });
      });
    }
    </script>
</body>
</html>

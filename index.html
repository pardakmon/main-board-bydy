<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영등포 통합 현황판</title>
    <style>

        :root {
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --card-bg: #ffffff;
        }
        body {
            margin: 0;
            padding: 0;

            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            letter-spacing: -0.5px;
        }
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0 0 10px 0;
        }
        .header p {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin: 0;
            font-weight: 400;
        }
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            width: 320px;
            height: 240px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            /* 은은한 그림자 효과 */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
            padding: 30px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        }
        .card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .card-title {
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        .card-desc {
            color: var(--text-sub);
            font-size: 1rem;
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>

<!-- 🌟 전체를 하나의 박스로 묶어 천장에서 40px 띄우고 중앙 정렬 -->
<div style="display: flex; flex-direction: column; align-items: center; padding-top: 40px; margin-bottom: 20px;">
    
    <!-- 대원님의 원본 문구 (건드리지 않음, 여백만 살짝 제거) -->
    <div class="header" style="margin-bottom: 0;">
        <h1 style="margin-bottom: 5px;">영등포소방서<br>통합 현황판</h1>
        <p style="margin-top: 0;">신속하고 정확한 현장 대응 시스템</p>
    </div>

    <!-- 🌟 버튼: 기존 margin-top:20px 을 8px로 줄여서 위쪽 문구와 확 밀착시킴 -->
    <button type="button" onclick="document.getElementById('qrModal').style.display='flex'" style="background:#0f172a; color:#fff; border-radius:12px; padding:12px 20px; font-weight:bold; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:8px; margin-top: 8px;">
      📱 통합현황판 QR 코드
    </button>
</div>

    <div class="container">
        <!-- href 안에 아파트 화재 현황판 웹사이트 주소를 넣으세요 -->
        <a href="https://pardakmon.github.io/apt-fire-board-bydy" class="card">
            <div class="card-icon">🏢🔥</div>
            <h2 class="card-title">공동주택 화재</h2>
            <p class="card-desc">세대별 대피 및 구조 현황</p>
        </a>

        <!-- href 안에 교통사고 현황판 웹사이트 주소를 넣으세요 -->
        <a href="https://pardakmon.github.io/accident-board-bydy" class="card">
            <div class="card-icon">🚗💥</div>
            <h2 class="card-title">교통사고</h2>
            <p class="card-desc">사고 발생 및 부상자 현황</p>
        </a>
    </div>

<!-- ========================================== -->
<!-- 🌟 통합현황판 메인 QR코드 팝업창 시작 -->
<!-- ========================================== -->
<div id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.7); backdrop-filter:blur(3px); align-items:center; justify-content:center; z-index:99999;">
  <div style="background:#fff; border-radius:16px; padding:30px; width:90vw; max-width:320px; text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
    <h3 style="margin:0 0 10px 0; font-size:18px; color:#1e293b; font-weight:900;">영등포 통합현황판</h3>
    <div style="font-size:13px; color:#64748b; margin-bottom:20px; font-weight:600;">스마트폰 카메라로 비추면 접속됩니다</div>
    
    <!-- QR코드가 들어갈 액자 -->
    <div style="background:#f8fafc; padding:15px; border-radius:12px; border:1px solid #e2e8f0; display:inline-block; margin-bottom:20px;">
      <img id="mainQrImage" src="" alt="QR Code" style="width:200px; height:200px; display:block;">
    </div>
    
    <button type="button" onclick="document.getElementById('qrModal').style.display='none'" style="width:100%; padding:14px; background:#f1f5f9; color:#334155; border:none; border-radius:12px; font-size:14.5px; font-weight:800; cursor:pointer;">
      닫기
    </button>
  </div>
</div>

<script>
  // 🌟 페이지가 열릴 때 깃허브 메인 주소를 QR코드로 자동 변환!
  window.addEventListener('DOMContentLoaded', () => {
    // 영구 고정된 메인 홈페이지 주소
    const myHomepageUrl = "https://pardakmon.github.io/main-board-bydy/"; 
    
    const encodedUrl = encodeURIComponent(myHomepageUrl);
    document.getElementById('mainQrImage').src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=1&data=" + encodedUrl;
  });
</script>
<!-- ========================================== -->
<!-- 🌟 통합현황판 메인 QR코드 팝업창 끝 -->
<!-- ========================================== -->

</body>
</html>
